<!doctype html>
<html lang="pt">
<head>
    <meta charset="utf-8">
    <title>FKS Character</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- camada da câmara: arrastar roda a personagem, roda do rato faz zoom -->
    <div id="stage"></div>

    <div id="app" class="hidden">
        <section id="panel">
            <header class="head">
                <div class="eyebrow">FKS · <span id="eyebrow-text"></span></div>
                <h1 id="title"></h1>
                <svg class="rule" viewBox="0 0 300 12" preserveAspectRatio="none" aria-hidden="true">
                    <path d="M2 6 Q75 3 146 6" /><path d="M154 6 Q225 9 298 6" />
                    <path class="gem" d="M150 1 L155 6 L150 11 L145 6 Z" />
                </svg>
            </header>

            <nav class="crumbs" id="crumbs">
                <button class="back" id="btn-prev" aria-label="Anterior"><svg><use href="#i-back" /></svg></button>
                <span id="view-title"></span>
                <span id="view-count"></span>
                <button class="back fwd" id="btn-next" aria-label="Seguinte"><svg><use href="#i-fwd" /></svg></button>
            </nav>

            <p class="tab-desc" id="tab-desc"></p>
            <div class="chips tabs" id="tabs"></div>

            <main id="view"></main>

            <footer class="foot">
                <div class="foot-row">
                    <div class="foot-btns" id="foot-btns">
                        <button class="btn ghost small" id="btn-random"><svg class="ico"><use href="#i-dice" /></svg><span data-t="act_random"></span></button>
                        <button class="btn ghost small" id="btn-reset"><svg class="ico"><use href="#i-undo" /></svg><span data-t="act_reset"></span></button>
                    </div>
                    <div class="hints" id="hints"></div>
                </div>
                <!-- ação principal: sempre visível e em destaque -->
                <button class="btn main hidden" id="btn-main"><span id="btn-main-text"></span><svg class="ico"><use href="#i-fwd" /></svg></button>
            </footer>

            <div id="modal" class="hidden">
                <div class="modal-card">
                    <h3 id="modal-title"></h3>
                    <div id="modal-body"></div>
                    <div class="modal-actions">
                        <button class="btn ghost" id="modal-cancel" data-t="cancel"></button>
                        <button class="btn" id="modal-ok" data-t="confirm"></button>
                    </div>
                </div>
            </div>

        </section>

        <aside id="cam" class="hidden">
            <div class="cam-presets" id="cam-presets"></div>
            <div class="cam-tools">
                <button class="back" data-cam="rotL"><svg><use href="#i-rotl" /></svg></button>
                <button class="back" data-cam="rotR"><svg><use href="#i-rotr" /></svg></button>
                <button class="back" data-cam="zoomIn"><svg><use href="#i-plus" /></svg></button>
                <button class="back" data-cam="zoomOut"><svg><use href="#i-minus" /></svg></button>
                <button class="back" data-cam="up"><svg><use href="#i-up" /></svg></button>
                <button class="back" data-cam="down"><svg><use href="#i-down" /></svg></button>
                <button class="back" data-cam="panL"><svg><use href="#i-panl" /></svg></button>
                <button class="back" data-cam="panR"><svg><use href="#i-panr" /></svg></button>
                <button class="back" data-cam="reset"><svg><use href="#i-reset" /></svg></button>
            </div>
            <div class="hints cam-hints" id="cam-hints"></div>
        </aside>
    </div>

    <div id="toasts"></div>

    <div id="loading" class="hidden">
        <svg class="spin" viewBox="0 0 64 64"><circle class="a" cx="32" cy="32" r="26" /></svg>
        <p id="loading-text"></p>
    </div>

    <!-- cutscene inicial: legendas + escolha de género -->
    <div id="subtitle" class="hidden"><p id="subtitle-text"></p></div>
    <div id="choose" class="hidden">
        <div class="choose-opts">
            <span data-model="mp_male"><svg class="ico"><use href="#i-male" /></svg><b data-t="male"></b></span>
            <span data-model="mp_female"><svg class="ico"><use href="#i-female" /></svg><b data-t="female"></b></span>
        </div>
        <div class="hints"><kbd>TAB</kbd> <span data-t="choose_switch"></span> &nbsp; <kbd>ENTER</kbd> <span data-t="choose_confirm"></span></div>
    </div>

    <!-- foto final -->
    <div id="photo" class="hidden">
        <p data-t="photo_text"></p>
        <div class="hints"><kbd>ENTER</kbd> <span data-t="photo_continue"></span> <span id="photo-count"></span></div>
    </div>

    <!-- escolha do kit inicial -->
    <div id="kits" class="hidden">
        <div class="kits-card">
            <div class="eyebrow" data-t="kits_eyebrow"></div>
            <h2 data-t="kits_title"></h2>
            <svg class="rule" viewBox="0 0 300 12" preserveAspectRatio="none" aria-hidden="true">
                <path d="M2 6 Q75 3 146 6" /><path d="M154 6 Q225 9 298 6" />
                <path class="gem" d="M150 1 L155 6 L150 11 L145 6 Z" />
            </svg>
            <p class="desc" data-t="kits_desc"></p>
            <div class="kits-grid" id="kits-grid"></div>
            <div class="kits-actions">
                <button class="btn ghost" id="kits-back" data-t="act_back"></button>
                <button class="btn main" id="kits-ok" disabled><span data-t="kits_confirm"></span><svg class="ico"><use href="#i-fwd" /></svg></button>
            </div>
        </div>
    </div>

    <!-- chegada de comboio: barras de cinema + cartão de título -->
    <div id="cine" class="hidden">
        <div class="bar top"></div>
        <div class="bar bottom"></div>
        <div id="cine-card" class="hidden">
            <h1 id="cine-title"></h1>
            <svg class="rule" viewBox="0 0 300 12" preserveAspectRatio="none" aria-hidden="true">
                <path d="M2 6 Q75 3 146 6" /><path d="M154 6 Q225 9 298 6" />
                <path class="gem" d="M150 1 L155 6 L150 11 L145 6 Z" />
            </svg>
            <div id="cine-sub"></div>
        </div>
        <div id="cine-skip" class="hints"></div>
    </div>

    <!-- Filtros e ícones (mesmo traço "tinta" do fks-stables) -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <defs>
            <filter id="ink" x="-10%" y="-10%" width="120%" height="120%">
                <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="3" seed="7" result="n" />
                <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6" xChannelSelector="R" yChannelSelector="G" />
            </filter>
            <filter id="ink-soft" x="-10%" y="-10%" width="120%" height="120%">
                <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="1" seed="3" result="n" />
                <feDisplacementMap in="SourceGraphic" in2="n" scale="1.4" />
            </filter>
        </defs>
        <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" /></symbol>
        <symbol id="i-fwd" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" /></symbol>
        <symbol id="i-left" viewBox="0 0 24 24"><path d="M14.5 5.5 8 12l6.5 6.5" /></symbol>
        <symbol id="i-right" viewBox="0 0 24 24"><path d="M9.5 5.5 16 12l-6.5 6.5" /></symbol>
        <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></symbol>
        <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14" /></symbol>
        <symbol id="i-up" viewBox="0 0 24 24"><path d="M5.5 14.5 12 8l6.5 6.5" /><path d="M12 8v11" /></symbol>
        <symbol id="i-down" viewBox="0 0 24 24"><path d="M5.5 9.5 12 16l6.5-6.5" /><path d="M12 16V5" /></symbol>
        <symbol id="i-panl" viewBox="0 0 24 24"><path d="M14.5 5.5 8 12l6.5 6.5" /><path d="M8 12h11" /></symbol>
        <symbol id="i-panr" viewBox="0 0 24 24"><path d="M9.5 5.5 16 12l-6.5 6.5" /><path d="M16 12H5" /></symbol>
        <symbol id="i-rotl" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7" /><path d="M4 4v4.5h4.5" /></symbol>
        <symbol id="i-rotr" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.4-5.7" /><path d="M20 4v4.5h-4.5" /></symbol>
        <symbol id="i-reset" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.5" /><circle cx="12" cy="12" r="1.2" class="dot" /></symbol>
        <symbol id="i-plus-c" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="M12 8v8M8 12h8" /></symbol>
        <symbol id="i-cross" viewBox="0 0 24 24"><path d="M12 3v18M7 8h10" /></symbol>
        <symbol id="i-dice" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3" /><circle cx="9" cy="9" r="1.1" class="dot" /><circle cx="15" cy="15" r="1.1" class="dot" /><circle cx="15" cy="9" r="1.1" class="dot" /><circle cx="9" cy="15" r="1.1" class="dot" /></symbol>
        <symbol id="i-undo" viewBox="0 0 24 24"><path d="M8 7H4V3" /><path d="M4.5 7A8 8 0 1 1 4 13" /></symbol>
        <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2" /><path d="M8 11V8a4 4 0 0 1 8 0v3" /></symbol>
        <symbol id="i-male" viewBox="0 0 24 24"><circle cx="10" cy="14" r="5.2" /><path d="M14 10l6-6M15.5 4H20v4.5" /></symbol>
        <symbol id="i-female" viewBox="0 0 24 24"><circle cx="12" cy="9" r="5.2" /><path d="M12 14.2V21M9 18h6" /></symbol>
    </svg>

    <script src="app.js"></script>
</body>
</html>
